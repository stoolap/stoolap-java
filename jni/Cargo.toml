[package]
name = "stoolap-jni"
version = "0.5.1"
edition = "2021"
publish = false

[lib]
name = "stoolap_jni"
crate-type = ["cdylib"]

[dependencies]
stoolap = { version = "0.5.1", default-features = false, features = ["parallel", "jemalloc"] }
jni = "0.21"
chrono = { version = "0.4", default-features = false }
